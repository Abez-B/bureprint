name: "✨ Feature Request"
description: "Suggest a new feature or enhancement for BurePrint"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve BurePrint! BurePrint is committed to local-first document processing, offline printing privacy, and broad hardware compatibility.

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
      placeholder: "Add support for..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any alternative solutions or features you've considered.
      placeholder: "I also tried..."

  - type: textarea
    id: context
    attributes:
      label: Printer or hardware context (if applicable)
      description: Printer brand, model, connection type (Wi-Fi IPP/IPPS, USB OTG), and Android device details.
      placeholder: "HP DeskJet 2700 over Wi-Fi / Epson L3150 over USB OTG"
